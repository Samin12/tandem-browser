# TEST ONLY: disposable credentials, never use on a public host.
name: tandem-ci
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
services:
  # One-time: open new profiles with vertical tabs, like desktop BrowserOS neo.
  # Runs before the engine starts; a marker keeps it from touching a profile
  # again, so the user's own choice in Neo wins afterwards.
  neo-prefs:
    image: ${TANDEM_NEO_IMAGE:?Load neo-image.env}
    user: '0'
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        marker=/data/.tandem-neo-prefs
        [ -e "$$marker" ] && exit 0
        prefs=/data/profile/Default/Preferences
        mkdir -p /data/profile/Default
        update='.vertical_tabs.enabled = true | .browseros.vertical_tabs_enabled = true'
        if [ -s "$$prefs" ]; then jq "$$update" "$$prefs" > "$$prefs.tmp"; else jq -n "$$update" > "$$prefs.tmp"; fi
        mv "$$prefs.tmp" "$$prefs"
        chown -R 1000:1000 /data/profile
        touch "$$marker"
    volumes:
      - neo-ci:/data
    restart: 'no'
  neo:
    image: ${TANDEM_NEO_IMAGE:?Load neo-image.env}
    depends_on:
      neo-prefs: {condition: service_completed_successfully}
    hostname: neo
    shm_size: 1g
    stop_grace_period: 45s
    restart: "no"
    environment:
      NEO_SCREEN: ${NEO_SCREEN:-1600x1000}
      PUID: '1000'
      PGID: '1000'
      # Show BrowserOS neo's own UI (Tandem's Neo view streams it): its dashboard
      # is an extension, and upstream's default list hides vertical tabs and more.
      NEO_DISABLE_BROWSEROS_EXTENSIONS: ${NEO_DISABLE_BROWSEROS_EXTENSIONS:-false}
      NEO_ARGS: ${NEO_ARGS:---disable-browseros-features=AvatarButton}
    volumes:
      - neo-ci:/data
      - ./policies/tandem-restore.json:/etc/chromium/policies/managed/tandem-restore.json:ro
    ports: ['127.0.0.1:${TANDEM_PORT:-8790}:8790']
    logging: *logging
  gateway:
    build: {context: '..', dockerfile: gateway/Dockerfile}
    network_mode: service:neo
    depends_on:
      neo: {condition: service_healthy, restart: true}
    environment:
      TANDEM_PUBLIC_ORIGIN: http://127.0.0.1:8790
      TANDEM_PASSWORD: tandem-local-test-password
      TANDEM_AGENT_TOKEN: tandem-local-test-token-00000000000000000000
      TANDEM_ENV: development
      TANDEM_AGENT_HOLD_SECONDS: '2'
      TANDEM_DATA_DIR: /var/lib/tandem
    volumes: ['gateway-ci:/var/lib/tandem']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    healthcheck:
      test: ['CMD', 'bun', '-e', 'const r=await fetch("http://127.0.0.1:8790/api/health");const h=await r.json();process.exit(r.ok&&h.ok&&h.cdp&&h.mcp?0:1)']
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6
    logging: *logging
volumes:
  neo-ci:
  gateway-ci:
