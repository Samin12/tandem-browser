# Tandem Browser for a Hostinger VPS built from the "Ubuntu 24.04 with Docker and
# Traefik" template, deployed as an hPanel Docker Manager project.
#
# Self-contained on purpose: Docker Manager stores only this file and the
# project's .env, so the restore policy is inline and the gateway image is built
# on the VPS by build-gateway.sh. The template's Traefik (host
# network, Let's Encrypt resolver "letsencrypt") terminates HTTPS and reaches the
# gateway on the neo container's address; no host port is published.
#
# .env (Docker Manager "environment"): TANDEM_HOST, TANDEM_NEO_IMAGE, optional
# TANDEM_GATEWAY_IMAGE, and the gateway's TANDEM_* settings (see ../.env.example).
# Single-quote TANDEM_PASSWORD_HASH so its "$" signs stay literal.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
services:
  # One-time: open new profiles with vertical tabs, like desktop BrowserOS neo.
  # Runs before the engine starts; a marker keeps it from touching a profile
  # again, so the user's own choice in Neo wins afterwards.
  neo-prefs:
    image: ${TANDEM_NEO_IMAGE:?Set TANDEM_NEO_IMAGE (tandem/deploy/neo-image.env)}
    user: '0'
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        marker=/data/.tandem-neo-prefs
        [ -e "$$marker" ] && exit 0
        prefs=/data/profile/Default/Preferences
        mkdir -p /data/profile/Default
        update='.vertical_tabs.enabled = true | .browseros.vertical_tabs_enabled = true'
        if [ -s "$$prefs" ]; then jq "$$update" "$$prefs" > "$$prefs.tmp"; else jq -n "$$update" > "$$prefs.tmp"; fi
        mv "$$prefs.tmp" "$$prefs"
        chown -R 1000:1000 /data/profile
        touch "$$marker"
    volumes:
      - neo-data:/data
    restart: 'no'
  neo:
    image: ${TANDEM_NEO_IMAGE:?Set TANDEM_NEO_IMAGE (tandem/deploy/neo-image.env)}
    depends_on:
      neo-prefs: {condition: service_completed_successfully}
    hostname: neo
    shm_size: 1g
    stop_grace_period: 45s
    restart: unless-stopped
    environment:
      NEO_SCREEN: ${NEO_SCREEN:-3200x2000}
      PUID: '1000'
      PGID: '1000'
      # Show BrowserOS neo's own UI (Tandem's Neo view streams it): its dashboard
      # is an extension, and upstream's default list hides vertical tabs and more.
      NEO_DISABLE_BROWSEROS_EXTENSIONS: ${NEO_DISABLE_BROWSEROS_EXTENSIONS:-false}
      # Retina-sharp: the engine draws 2x device pixels per CSS pixel; the gateway
      # tells viewers the same scale (TANDEM_DISPLAY_SCALE) so they size the screen to match.
      NEO_ARGS: ${NEO_ARGS:---disable-browseros-features=AvatarButton --force-device-scale-factor=${TANDEM_DISPLAY_SCALE:-2}}
    volumes:
      - neo-data:/data
    configs:
      - source: tandem-restore-policy
        target: /etc/chromium/policies/managed/tandem-restore.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.tandem.rule=Host(`${TANDEM_HOST:?Set TANDEM_HOST}`)
      - traefik.http.routers.tandem.entrypoints=websecure
      - traefik.http.routers.tandem.tls.certresolver=letsencrypt
      - traefik.http.routers.tandem.middlewares=tandem-hsts
      - traefik.http.middlewares.tandem-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.tandem-hsts.headers.stsIncludeSubdomains=false
      - traefik.http.services.tandem.loadbalancer.server.port=8790
    logging: *logging
  gateway:
    # Docker Manager never builds. tandem/deploy/hostinger/build-gateway.sh builds
    # this tag on the VPS from a sparse checkout of tandem/ (a git build context
    # would try to clone upstream's private submodule).
    image: ${TANDEM_GATEWAY_IMAGE:-tandem-gateway:local}
    pull_policy: missing
    network_mode: service:neo
    depends_on:
      neo: {condition: service_healthy, restart: true}
    env_file: .env
    environment:
      TANDEM_DISPLAY_SCALE: ${TANDEM_DISPLAY_SCALE:-2}
      TANDEM_ENV: production
      TANDEM_DATA_DIR: /var/lib/tandem
      TANDEM_PUBLIC_ORIGIN: https://${TANDEM_HOST}
    volumes:
      - gateway-data:/var/lib/tandem
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'bun', '-e', 'const r=await fetch("http://127.0.0.1:8790/api/health");const h=await r.json();process.exit(r.ok&&h.ok&&h.cdp&&h.mcp?0:1)']
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6
    logging: *logging
configs:
  tandem-restore-policy:
    content: |
      {"RestoreOnStartup": 1}
volumes:
  neo-data:
  gateway-data:
