# Tandem Browser for a Hostinger VPS built from the "Ubuntu 24.04 with Docker and
# Traefik" template, deployed as an hPanel Docker Manager project.
#
# Self-contained on purpose: Docker Manager stores only this file and the
# project's .env, so policies and the start page are inline and the gateway image is built
# on the VPS by build-gateway.sh. The template's Traefik (host
# network, Let's Encrypt resolver "letsencrypt") terminates HTTPS and reaches the
# gateway on the neo container's address; the private viewer port stays on host loopback.
#
# .env (Docker Manager "environment"): TANDEM_HOST, TANDEM_NEO_IMAGE, optional
# TANDEM_GATEWAY_IMAGE, and the gateway's TANDEM_* settings (see ../.env.example).
# Single-quote TANDEM_PASSWORD_HASH so its "$" signs stay literal.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
services:
  # One-time: open new profiles with vertical tabs, like desktop BrowserOS neo.
  # Runs before the engine starts; a marker keeps it from touching a profile
  # again, so the user's own choice in Neo wins afterwards.
  neo-prefs:
    image: ${TANDEM_NEO_IMAGE:?Set TANDEM_NEO_IMAGE (tandem/deploy/neo-image.env)}
    user: '0'
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        marker=/data/.tandem-neo-prefs
        [ -e "$$marker" ] && exit 0
        prefs=/data/profile/Default/Preferences
        mkdir -p /data/profile/Default
        update='.vertical_tabs.enabled = true | .browseros.vertical_tabs_enabled = true'
        if [ -s "$$prefs" ]; then jq "$$update" "$$prefs" > "$$prefs.tmp"; else jq -n "$$update" > "$$prefs.tmp"; fi
        mv "$$prefs.tmp" "$$prefs"
        chown -R 1000:1000 /data/profile
        touch "$$marker"
    volumes:
      - neo-data:/data
    restart: 'no'
  neo:
    image: ${TANDEM_NEO_IMAGE:?Set TANDEM_NEO_IMAGE (tandem/deploy/neo-image.env)}
    depends_on:
      neo-prefs: {condition: service_completed_successfully}
    hostname: neo
    # neko (below) captures this display: it needs the X socket and shared memory.
    ipc: shareable
    shm_size: 1g
    stop_grace_period: 45s
    restart: unless-stopped
    environment:
      NEO_SCREEN: ${NEO_SCREEN:-3200x2000}
      PUID: '1000'
      PGID: '1000'
      # Show BrowserOS neo's own UI (Tandem's Neo view streams it): its dashboard
      # is an extension, and upstream's default list hides vertical tabs and more.
      NEO_DISABLE_BROWSEROS_EXTENSIONS: ${NEO_DISABLE_BROWSEROS_EXTENSIONS:-false}
      # Retina-sharp: the engine draws 2x device pixels per CSS pixel; the gateway
      # tells viewers the same scale (TANDEM_DISPLAY_SCALE) so they size the screen to match.
      NEO_ARGS: ${NEO_ARGS:---disable-browseros-features=AvatarButton --force-device-scale-factor=${TANDEM_DISPLAY_SCALE:-2}}
    volumes:
      - x11:/tmp/.X11-unix
      - neo-data:/data
    configs:
      - source: tandem-restore-policy
        target: /etc/chromium/policies/managed/tandem-restore.json
      - source: tandem-start-policy
        target: /etc/chromium/policies/managed/tandem-start.json
      - source: tandem-start-page
        target: /opt/tandem/start/index.html
    ports:
      # Private viewer for tailscale serve on the host; never publish to the internet.
      - '127.0.0.1:${TANDEM_PRIVATE_PORT:-8791}:8791'
      # WebRTC media for neko (UDP, with TCP as a fallback).
      - '${TANDEM_WEBRTC_PORT:-59000}:59000/udp'
      - '${TANDEM_WEBRTC_PORT:-59000}:59000/tcp'
    labels:
      - traefik.enable=true
      - traefik.http.routers.tandem.rule=Host(`${TANDEM_HOST:?Set TANDEM_HOST}`)
      - traefik.http.routers.tandem.entrypoints=websecure
      - traefik.http.routers.tandem.tls.certresolver=letsencrypt
      - traefik.http.routers.tandem.middlewares=tandem-hsts
      - traefik.http.middlewares.tandem-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.tandem-hsts.headers.stsIncludeSubdomains=false
      - traefik.http.services.tandem.loadbalancer.server.port=8790
    logging: *logging
  # WebRTC streaming of the engine's display (m1k1o/neko, Apache-2.0). Only the
  # gateway talks to it (127.0.0.1:8080 in the shared namespace); media uses the
  # mux port published on neo. Input arrives over XTest, and neko applies it only
  # for its host, whom the gateway sets from Tandem's control.
  neko:
    # Let the agent browser win CPU contention; the stream drops frames instead.
    cpu_shares: 256
    image: ${TANDEM_NEKO_IMAGE:-ghcr.io/m1k1o/neko/base:3.2.0@sha256:587a3389b6b99c8999eb00a768c79205a74647c57cf5b9695a90234a0edaa446}
    network_mode: service:neo
    ipc: service:neo
    user: '1000'
    depends_on:
      neo: {condition: service_healthy}
    entrypoint: ['/usr/bin/neko', 'serve']
    environment:
      DISPLAY: ':1'
      NEKO_SERVER_BIND: 127.0.0.1:8080
      NEKO_SERVER_PROXY: 'true'
      NEKO_SERVER_METRICS: 'false'
      NEKO_LEGACY: 'false'
      NEKO_CHAT_ENABLED: 'false'
      NEKO_FILETRANSFER_ENABLED: 'false'
      # Neo's Xvnc has no xf86-input-neko driver; input goes through XTest.
      NEKO_DESKTOP_INPUT_ENABLED: 'false'
      # neko sets the display to this size at start; keep it equal to NEO_SCREEN.
      NEKO_DESKTOP_SCREEN: ${NEKO_SCREEN:-3200x2000@${TANDEM_STREAM_FPS:-25}}
      NEKO_MEMBER_PROVIDER: multiuser
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: ${TANDEM_NEKO_ADMIN_PASSWORD:?Set TANDEM_NEKO_ADMIN_PASSWORD}
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: ${TANDEM_NEKO_USER_PASSWORD:?Set TANDEM_NEKO_USER_PASSWORD}
      NEKO_SESSION_API_TOKEN: ${TANDEM_NEKO_API_TOKEN:?Set TANDEM_NEKO_API_TOKEN}
      NEKO_WEBRTC_UDPMUX: '59000'
      NEKO_WEBRTC_TCPMUX: '59000'
      NEKO_WEBRTC_NAT1TO1: ${TANDEM_PUBLIC_IP:?Set TANDEM_PUBLIC_IP (the server's public IPv4 address)}
      NEKO_CAPTURE_VIDEO_CODEC: h264
      NEKO_CAPTURE_VIDEO_PIPELINES: '{"main":{"fps":"${TANDEM_STREAM_FPS:-25}","gst_prefix":"! video/x-raw,format=I420","gst_encoder":"x264enc","gst_params":{"threads":"2","bitrate":"6000","key-int-max":"50","byte-stream":"true","tune":"zerolatency","speed-preset":"ultrafast"},"gst_suffix":"! video/x-h264,stream-format=byte-stream,profile=constrained-baseline"}}'
    volumes:
      - x11:/tmp/.X11-unix
    restart: unless-stopped
    logging: *logging
  # Linux delays loopback ACKs 40 ms; Neo's server/browser exchange small writes,
  # stalling each tool call. Keep quickack set, including after route changes.
  neo-net:
    image: ${TANDEM_GATEWAY_IMAGE:-tandem-gateway:local}
    pull_policy: missing
    network_mode: service:neo
    user: '0'
    entrypoint: ['/bin/sh', '/app/neo-net.sh']
    healthcheck: {disable: true}
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    read_only: true
    security_opt: [no-new-privileges:true]
    depends_on:
      neo: {condition: service_healthy, restart: true}
    restart: unless-stopped
    logging: *logging
  gateway:
    # Docker Manager never builds. tandem/deploy/hostinger/build-gateway.sh builds
    # this tag on the VPS from a sparse checkout of tandem/ (a git build context
    # would try to clone upstream's private submodule).
    image: ${TANDEM_GATEWAY_IMAGE:-tandem-gateway:local}
    pull_policy: missing
    network_mode: service:neo
    depends_on:
      neo: {condition: service_healthy, restart: true}
    env_file: .env
    environment:
      TANDEM_NEKO_URL: http://127.0.0.1:8080
      TANDEM_DISPLAY_SCALE: ${TANDEM_DISPLAY_SCALE:-2}
      TANDEM_ENV: production
      TANDEM_DATA_DIR: /var/lib/tandem
      TANDEM_PUBLIC_ORIGIN: ${TANDEM_PUBLIC_ORIGIN:-https://${TANDEM_HOST}}
    volumes:
      - gateway-data:/var/lib/tandem
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'bun', '-e', 'const r=await fetch("http://127.0.0.1:8790/api/health");const h=await r.json();process.exit(r.ok&&h.ok&&h.cdp&&h.mcp?0:1)']
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6
    logging: *logging
configs:
  tandem-restore-policy:
    content: |
      {"RestoreOnStartup": 1}
  # BEGIN GENERATED TANDEM START CONFIGS
  # Generated by sync-start-config.py; edit the source page/policy instead.
  tandem-start-policy:
    content: |
      {
        "NewTabPageLocation": "file:///opt/tandem/start/index.html",
        "HomepageLocation": "file:///opt/tandem/start/index.html",
        "HomepageIsNewTabPage": false,
        "ShowHomeButton": true
      }
  tandem-start-page:
    content: |
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">
        <title>New Tab</title>
        <style>
          :root {
            color-scheme: light dark;
            --background: #F7FAFD;
            --surface: #FFFFFF;
            --text: #14202B;
            --muted: #5F6B78;
            --border: #DCE6F0;
            --accent: #2F80D6;
            /* Accessible white button content: 4.52:1. */
            --primary: #2B78CA;
            --agent: #6D5BD0;
            --hover: #EEF4FA;
            --shadow: 0 8px 32px #14202B06, 0 2px 5px #14202B03;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--background);
            color: var(--text);
          }
          * { box-sizing: border-box; }
          body { margin: 0; min-width: 280px; }
          main {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 64px 24px 112px;
          }
          .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 44px; }
          .brand svg { width: 68px; height: 68px; overflow: visible; }
          h1 { font-size: 42px; font-weight: 550; letter-spacing: -1.8px; margin: 0; }
          form { width: min(100%, 660px); }
          .search {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px 12px 22px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: var(--shadow);
            transition: border-color .15s, box-shadow .15s;
          }
          .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent), var(--shadow); }
          .search > svg { width: 21px; height: 21px; color: var(--muted); flex-shrink: 0; }
          input {
            min-width: 0;
            width: 100%;
            padding: 8px 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 17px;
          }
          input::placeholder { color: var(--muted); opacity: 1; }
          button {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border: 0;
            border-radius: 11px;
            background: var(--primary);
            color: #FFFFFF;
            cursor: pointer;
          }
          button:hover { filter: brightness(.93); }
          button svg { width: 20px; height: 20px; }
          a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
          nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 24px; max-width: 700px; }
          nav a {
            display: inline-flex;
            align-items: center;
            padding: 10px 13px;
            border-radius: 10px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background .15s, color .15s;
          }
          nav a:hover { color: var(--text); background: var(--hover); }
          .hint { display: flex; align-items: center; gap: 9px; margin: 52px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
          .hint::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--agent); flex-shrink: 0; }
          @media (prefers-color-scheme: dark) {
            :root {
              --background: #0F1720;
              --accent: #5FAAF0;
              --agent: #B4A5FF;
              --surface: #16212C;
              --text: #E6EEF6;
              --muted: #A5B4C4;
              --border: #243241;
              --hover: #20303F;
              --shadow: 0 8px 32px #00000014;
            }
          }
          @media (max-width: 520px) {
            main { padding: 48px 20px 80px; }
            .brand { margin-bottom: 32px; gap: 10px; }
            .brand svg { width: 56px; height: 56px; }
            h1 { font-size: 36px; }
            .search { padding-left: 16px; gap: 10px; border-radius: 16px; }
            input { font-size: 16px; }
            nav { gap: 2px; margin-top: 20px; }
            nav a { padding: 10px; }
            .hint { margin-top: 36px; font-size: 11px; }
          }
        </style>
      </head>
      <body>
        <main>
          <header class="brand">
            <!-- Inline mark from tandem/branding/mark.svg; no remote assets. -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="296 246 450 548" aria-hidden="true">
      <defs><filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B2A4A" flood-opacity="0.18"/></filter>
      <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FAAF0"/><stop offset="1" stop-color="#2F80D6"/></linearGradient></defs>
      <g transform="translate(322 264) scale(1.5)"><path d="M0 0 L0 196 L50 152 L84 228 L120 212 L86 138 L148 138 Z" fill="#B9DCF8"/></g>
      <g filter="url(#s)" transform="translate(492 416) scale(1.5)"><path d="M0 0 L0 196 L50 152 L84 228 L120 212 L86 138 L148 138 Z" fill="url(#f)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" paint-order="stroke"/></g>
      </svg>
            <h1>Tandem</h1>
          </header>
          <form action="https://www.google.com/search" method="get" role="search" aria-label="Search or go to a website">
            <div class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5" stroke-linecap="round"/></svg>
              <input type="text" name="q" aria-label="Search or enter a URL" placeholder="Search or enter a URL" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
              <button type="submit" aria-label="Go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
            </div>
          </form>
          <nav aria-label="Quick links">
            <a href="https://www.google.com/">Google</a>
            <a href="https://mail.google.com/">Gmail</a>
            <a href="https://www.youtube.com/">YouTube</a>
            <a href="https://www.tradingview.com/">TradingView</a>
            <a href="https://www.quiverquant.com/">Quiver Quantitative</a>
          </nav>
          <p class="hint">Your agent and you share this browser.</p>
        </main>
        <script>
          // Keep navigation local until the user submits. No telemetry or remote assets.
          function destination(value) {
            const text = value.trim();
            if (!text) return null;
            if (!/\s/.test(text)) {
              // Only explicit web URLs, hostnames, IPs and localhost are navigations.
              // Other schemes (including javascript:) remain ordinary search text.
              const explicit = /^https?:\/\//i.test(text);
              const host = /^(?:localhost|(?:[a-z0-9\u00a1-\uffff](?:[a-z0-9\u00a1-\uffff-]*[a-z0-9\u00a1-\uffff])?\.)+[a-z\u00a1-\uffff]{2,}|(?:\d{1,3}\.){3}\d{1,3}|\[[0-9a-f:]+\])(?::\d+)?(?:[/?#]|$$)/i.test(text);
              if (explicit || host) {
                try {
                  const url = new URL(explicit ? text : (text.startsWith('localhost') || text.startsWith('127.') || text.startsWith('[::1]') ? 'http://' : 'https://') + text);
                  if ((url.protocol === 'https:' || url.protocol === 'http:') && url.hostname && !url.username && !url.password) return url.href;
                } catch { /* Invalid URLs fall through to search. */ }
              }
            }
            return 'https://www.google.com/search?q=' + encodeURIComponent(text);
          }
          document.querySelector('form').addEventListener('submit', (event) => {
            event.preventDefault();
            const url = destination(event.currentTarget.elements.q.value);
            if (url) window.location.assign(url);
          });
        </script>
      </body>
      </html>
  # END GENERATED TANDEM START CONFIGS
volumes:
  x11:
  neo-data:
  gateway-data:
