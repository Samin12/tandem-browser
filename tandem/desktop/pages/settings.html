<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Change Server</title><link rel="stylesheet" href="style.css"><script defer src="brand.js"></script><script defer src="local.js"></script></head>
<body data-page="settings"><main>
  <img src="logo.svg" width="64" height="64" alt="">
  <p class="eyebrow" data-product></p><h1>Connect to your browser</h1>
  <p>Your browser runs on your server. Enter its address to watch or take control.</p>
  <form id="settings-form"><label for="server-url">Server URL</label><input id="server-url" type="url" placeholder="https://browser.example.com" autocomplete="url" spellcheck="false" required autofocus>
  <p class="hint">Use HTTPS. Local testing also supports HTTP on localhost or 127.0.0.1.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="actions"><button type="button" id="check" class="secondary">Check connection</button><button type="submit" id="save">Save and connect</button></div></form>
</main></body></html>
