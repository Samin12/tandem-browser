<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="682" viewBox="0 0 1120 682">
<defs>
<style>text{font-family:Arial,sans-serif;fill:#1F1E1D} .muted{fill:#6B6A65} .clay{fill:#C96442} .blue{fill:#4A6FA5} .eyebrow{font-size:13px;font-weight:700;letter-spacing:2px}</style>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#49382B" flood-opacity=".14"/></filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#9A968B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1120" height="682" rx="26" fill="#FAF9F5"/>
<rect x=".75" y=".75" width="1118.5" height="680.5" rx="25.25" fill="none" stroke="#E3DFD3" stroke-width="1.5"/>
<text x="44" y="51" font-size="12" class="clay" font-weight="700" letter-spacing="1.8">MADE TO SHARE THE WHEEL</text>
<text x="44" y="104" font-size="36" font-weight="500" letter-spacing="-1">Your browser, with room for both of you.</text>
<rect x="44" y="143" width="332" height="229" rx="15" fill="#FFFEFA" stroke="#E3DFD3"/>
<rect x="66" y="165" width="43" height="43" rx="11" fill="#E9EDF3"/>
<g transform="translate(75.5 174.5) scale(1)" fill="none" stroke="#4A6FA5" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></g>
<text x="66" y="251" font-size="20" font-weight="600" letter-spacing="-.35">Always on</text>
<text x="66" y="284" font-size="17" class="muted" >Runs on your VPS, even when</text>
<text x="66" y="310" font-size="17" class="muted" >your laptop is closed.</text>
<rect x="394" y="143" width="332" height="229" rx="15" fill="#FFFEFA" stroke="#E3DFD3"/>
<rect x="416" y="165" width="43" height="43" rx="11" fill="#F5E9E1"/>
<g transform="translate(425.5 174.5) scale(1)" fill="none" stroke="#C96442" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="15" height="12" rx="2"/><path d="M6 19h4m-2-4v4M4 6h11"/><rect x="17" y="10" width="5" height="11" rx="1.5"/></g>
<text x="416" y="251" font-size="20" font-weight="600" letter-spacing="-.35">Same tabs, anywhere</text>
<text x="416" y="284" font-size="17" class="muted" >Open the same session from</text>
<text x="416" y="310" font-size="17" class="muted" >any computer.</text>
<rect x="744" y="143" width="332" height="229" rx="15" fill="#FFFEFA" stroke="#E3DFD3"/>
<rect x="766" y="165" width="43" height="43" rx="11" fill="#F5E9E1"/>
<g transform="translate(775.5 174.5) scale(1)" fill="none" stroke="#C96442" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 11-7 1-3 6z"/><path d="m14 16 3 5M17 3v3m3 1h-3"/></g>
<text x="766" y="251" font-size="20" font-weight="600" letter-spacing="-.35">Take the wheel anytime</text>
<text x="766" y="284" font-size="17" class="muted" >Click, type and scroll. Your agent</text>
<text x="766" y="310" font-size="17" class="muted" >waits until you hand back.</text>
<rect x="44" y="392" width="332" height="229" rx="15" fill="#FFFEFA" stroke="#E3DFD3"/>
<rect x="66" y="414" width="43" height="43" rx="11" fill="#F5E9E1"/>
<g transform="translate(75.5 423.5) scale(1)" fill="none" stroke="#C96442" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></g>
<text x="66" y="500" font-size="20" font-weight="600" letter-spacing="-.35">Locked down</text>
<text x="66" y="533" font-size="17" class="muted" >Login + 2FA. Nothing else</text>
<text x="66" y="559" font-size="17" class="muted" >exposed to the internet.</text>
<rect x="394" y="392" width="332" height="229" rx="15" fill="#FFFEFA" stroke="#E3DFD3"/>
<rect x="416" y="414" width="43" height="43" rx="11" fill="#E9EDF3"/>
<g transform="translate(425.5 423.5) scale(1)" fill="none" stroke="#4A6FA5" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m7 5-5 7 5 7m10-14 5 7-5 7m-3-16-4 20"/></g>
<text x="416" y="500" font-size="20" font-weight="600" letter-spacing="-.35">Works with any MCP agent</text>
<text x="416" y="533" font-size="17" class="muted" >Bring Hermes, Claude Code,</text>
<text x="416" y="559" font-size="17" class="muted" >Codex or your MCP client.</text>
<rect x="744" y="392" width="332" height="229" rx="15" fill="#FFFEFA" stroke="#E3DFD3"/>
<rect x="766" y="414" width="43" height="43" rx="11" fill="#F5E9E1"/>
<g transform="translate(775.5 423.5) scale(1)" fill="none" stroke="#C96442" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M20 9a8 8 0 0 0-14-3L3 9m0-5v5h5M4 15a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/></g>
<text x="766" y="500" font-size="20" font-weight="600" letter-spacing="-.35">Stays current</text>
<text x="766" y="533" font-size="17" class="muted" >Follows upstream updates,</text>
<text x="766" y="559" font-size="17" class="muted" >with checks before they land.</text>
</svg>
