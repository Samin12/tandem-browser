<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/styles.css"><script type="module" src="/assets/app.js"></script></head>
<body class="viewer">
<header class="chrome">
  <div class="tab-row"><img class="brand-mark" data-logo alt="Browser" src="/favicon.svg"><div id="tabs" class="tabs" role="tablist" aria-label="Browser tabs"></div><button id="new-tab" class="icon-button new-tab" aria-label="New tab" title="New tab">+</button><span id="connection" class="connection" role="status">Connecting…</span></div>
  <div class="toolbar" aria-label="Browser toolbar">
    <nav class="navigation" aria-label="Page navigation"><button id="back" class="icon-button" aria-label="Back" title="Back">←</button><button id="forward" class="icon-button" aria-label="Forward" title="Forward">→</button><button id="reload" class="icon-button" aria-label="Reload" title="Reload">↻</button></nav>
    <form id="address-form" class="address-form"><span class="address-icon" aria-hidden="true">⌕</span><input id="address" aria-label="Address or search" placeholder="Search or enter a URL" spellcheck="false" autocomplete="off" autocapitalize="off"><span id="view-only" class="address-hint">VIEW ONLY</span></form>
    <div class="toolbar-right"><span id="control-indicator" class="control-indicator" role="status"></span><div id="modes" class="modes" role="group" aria-label="Control mode"><button data-mode="watch" title="Follow the agent's active tab">Watch</button><button data-mode="agent" title="View a tab while the agent drives">Agent</button><button data-mode="manual" title="Take control and pause the agent">Manual</button></div>
    <button id="desktop-view" class="desktop-button" title="Shows the raw screen for native popups: select menus, file pickers and extension popups. Requires manual control.">▣ <span>Desktop view</span></button>
    <div class="menu-wrap"><button id="menu-button" class="icon-button" aria-label="Browser menu" aria-expanded="false" aria-controls="menu">⋯</button><div id="menu" class="menu" hidden><button id="show-audit">Audit log</button><button id="settings" hidden>Server settings</button><button id="logout">Log out</button></div></div></div>
  </div>
</header>
<div id="control-banner" class="control-banner"><span id="banner-text"></span><button id="banner-action">Take control</button></div>
<main id="page-area" class="page-area"><canvas id="page" tabindex="0" contenteditable="plaintext-only" spellcheck="false" aria-label="Remote browser page. Take manual control to interact."></canvas><div id="empty" class="empty-state"><img data-logo src="/favicon.svg" alt="Browser"><h1 id="empty-title">Your shared browser</h1><p id="empty-description">Connecting to your browser…</p></div><div id="notice" class="notice" role="status" hidden></div></main>
<dialog id="remote-dialog" aria-labelledby="dialog-title"><form id="dialog-form"><p class="eyebrow">PAGE DIALOG</p><h2 id="dialog-title"></h2><p id="dialog-message"></p><label id="prompt-label">Response<input id="dialog-prompt" autocomplete="off"></label><p id="dialog-readonly" class="muted" hidden></p><div class="dialog-actions"><button type="button" id="dialog-take-control">Take control</button><button type="button" id="dialog-cancel">Cancel</button><button id="dialog-accept" class="primary" type="submit">OK</button></div></form></dialog>
<dialog id="audit-dialog" aria-labelledby="audit-title"><div class="audit-heading"><h2 id="audit-title">Audit log</h2><button id="audit-close" class="icon-button" aria-label="Close audit log">×</button></div><p class="muted">Recent browser and control activity</p><pre id="audit-content"></pre></dialog>
</body></html>
