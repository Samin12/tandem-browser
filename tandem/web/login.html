<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Tandem</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/styles.css"><script type="module" src="/assets/login.js"></script></head>
<body class="login-page"><main class="login-card"><img class="login-logo" data-logo="app" src="/assets/app-icon.svg" alt="Tandem Browser"><p class="eyebrow">YOUR BROWSER, TOGETHER</p><h1 data-product>Tandem Browser</h1><p id="tagline" class="muted">Sign in to your shared browser.</p><form id="login-form"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><div id="totp-field" hidden><label for="totp">Authentication code</label><input id="totp" name="totp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000"></div><p id="login-error" class="login-error" role="alert"></p><button class="primary" id="login-submit" type="submit" disabled>Sign in <span aria-hidden="true">→</span></button></form><p class="login-footer">One browser. A shared point of view.</p></main></body></html>
