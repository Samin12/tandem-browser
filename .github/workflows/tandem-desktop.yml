name: Tandem desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['tandem-desktop-v*']
permissions:
  contents: read
concurrency:
  group: tandem-desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.3.14'}
      - name: Package
        working-directory: tandem/desktop
        run: |
          bun install --frozen-lockfile
          bun run dist
      - uses: actions/upload-artifact@v4
        with:
          name: tandem-desktop-${{ matrix.os }}
          path: tandem/desktop/release/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/tandem-desktop-v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --draft --title "Tandem Desktop $RELEASE_TAG" --notes 'Unsigned Tandem desktop packages. Review before publishing.'
          test "$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft)" = true
          find artifacts -type f -print0 | xargs -0 -I '{}' gh release upload "$RELEASE_TAG" '{}' --clobber
